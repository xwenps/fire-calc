<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A21" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>

    <!-- Chart / Flame Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#33D69F" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33D69F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#2A2F3A" stroke-width="8" />

  <!-- Background Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" />

  <!-- Graph / Flame Motif Container -->
  <g filter="url(#subtleShadow)">
    <!-- Bar 1 (Left) -->
    <rect x="128" y="280" width="48" height="104" rx="12" fill="#2A2F3A" />
    
    <!-- Bar 2 (Middle) -->
    <rect x="200" y="210" width="48" height="174" rx="12" fill="url(#accentGrad)" opacity="0.85" />
    
    <!-- Bar 3 / Rising Peak (Right) -->
    <rect x="272" y="140" width="48" height="244" rx="12" fill="url(#accentGrad)" />

    <!-- Flame Arc / Trend Peak Curve -->
    <path d="M 128 290 Q 240 240 336 128" fill="none" stroke="#33D69F" stroke-width="16" stroke-linecap="round" />

    <!-- Spark / Goal Point -->
    <circle cx="336" cy="128" r="18" fill="#33D69F" />
    <circle cx="336" cy="128" r="8" fill="#FFFFFF" />
  </g>
</svg>
