<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Pastel Gradient Background -->
    <linearGradient id="pastelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5EC" />
      <stop offset="50%" stop-color="#FFD6A5" />
      <stop offset="100%" stop-color="#E8AEB7" />
    </linearGradient>

    <!-- Outer Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="60%" stop-color="#FF9000" />
      <stop offset="100%" stop-color="#FFD000" />
    </linearGradient>

    <!-- Inner Core Gradient -->
    <linearGradient id="innerCoreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF7A59" />
      <stop offset="60%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FFF59D" />
    </linearGradient>

    <!-- Multi-Tip Flame Outer Path -->
    <!-- Used for both the outer flame and the clipping path for inner details -->
    <clipPath id="multiTipFlameClip">
      <path d="M 256 65
               C 275 120 310 160 340 180
               C 365 200 390 200 395 240
               C 405 290 380 340 345 380
               C 310 420 280 435 256 435
               C 232 435 202 420 167 380
               C 132 340 107 290 117 240
               C 122 200 147 200 172 180
               C 202 160 237 120 256 65 Z" />
    </clipPath>
  </defs>

  <!-- Squircle App Container (Pastel Background) -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#pastelBg)" stroke="#FFFFFF" stroke-width="6" />

  <!-- Soft Shadow Under Flame -->
  <ellipse cx="256" cy="445" rx="120" ry="16" fill="#B38B95" opacity="0.3" />

  <!-- Outer Dynamic 3-Tip Flame -->
  <path d="M 256 65
           C 275 120 310 160 340 180
           C 365 200 390 200 395 240
           C 405 290 380 340 345 380
           C 310 420 280 435 256 435
           C 232 435 202 420 167 380
           C 132 340 107 290 117 240
           C 122 200 147 200 172 180
           C 202 160 237 120 256 65 Z" 
        fill="url(#flameGrad)" />

  <!-- Inner Flame & Beach Elements Clipped Inside Flame -->
  <g clip-path="url(#multiTipFlameClip)">
    <!-- Inner Glowing Core (Secondary Flame shape) -->
    <path d="M 256 160
             C 270 200 295 230 315 250
             C 330 265 345 270 348 295
             C 355 330 335 365 310 390
             C 285 415 265 425 256 425
             C 247 425 227 415 202 390
             C 177 365 157 330 164 295
             C 167 270 182 265 197 250
             C 217 230 242 200 256 160 Z" 
          fill="url(#innerCoreGrad)" />

    <!-- Beach Dune (Shifted down to bottom right corner) -->
    <path d="M 210 440 C 270 380 380 370 410 440 Z" fill="#2E7D32" />

    <!-- Small Palm Tree (Bottom Right - Away from face) -->
    <!-- Trunk -->
    <path d="M 320 410 Q 330 370 345 340 Q 350 342 348 346 Q 336 372 328 410 Z" fill="#5D4037" />
    <!-- Fronds -->
    <path d="M 345 340 Q 320 330 300 345 Q 325 348 345 340Z" fill="#1B5E20" />
    <path d="M 345 340 Q 335 315 320 310 Q 332 328 345 340Z" fill="#2E7D32" />
    <path d="M 345 340 Q 370 320 388 330 Q 368 338 345 340Z" fill="#1B5E20" />
    <path d="M 345 340 Q 372 342 390 358 Q 368 355 345 340Z" fill="#2E7D32" />
  </g>

  <!-- Cute Face (Clear & Unobstructed) -->
  <!-- Left Eye -->
  <circle cx="215" cy="300" r="10" fill="#1E293B" />
  <circle cx="212" cy="297" r="3.5" fill="#FFFFFF" />
  
  <!-- Right Eye -->
  <circle cx="297" cy="300" r="10" fill="#1E293B" />
  <circle cx="294" cy="297" r="3.5" fill="#FFFFFF" />

  <!-- Rosy Cheeks -->
  <ellipse cx="200" cy="312" rx="8" ry="5" fill="#FF5252" opacity="0.3" />
  <ellipse cx="312" cy="312" rx="8" ry="5" fill="#FF5252" opacity="0.3" />

  <!-- Happy Smile -->
  <path d="M 242 316 Q 256 328 270 316" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
</svg>
